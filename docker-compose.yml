# Infrastructure locale du projet « Promesse tenue ? »
# - postgres : entrepôt de données (avec l'extension pgvector pour la recherche sémantique)
# - rustfs   : data lake (stockage de fichiers compatible S3, remplace MinIO retiré de Docker Hub)
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pt-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"          # 5433 côté Mac pour éviter un conflit avec un Postgres déjà installé
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: pt-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"          # API S3 (utilisée par le code Python)
      - "9001:9001"          # console web : http://localhost:9001
    volumes:
      - s3data:/data

volumes:
  pgdata:
  s3data:
